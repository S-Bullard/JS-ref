<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>JS PhotoReference</title>
    <style>
        * {box-sizing: border-box;} 
        body, html{
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #424150;
            color:aliceblue;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #canvas {
            width:100%;
            height:calc(100vh - 32px);
            position: relative;
            overflow:hidden;
            cursor:grab;
        }
        #canvas:active{
            cursor:grabbing;
        }
        .reference-image {
        position: absolute;
        max-width: 300px;
        height: auto;
        cursor: grab;
        user-select: none;
        }

        .reference-image:active {
        cursor: grabbing;
        }


        /*header styling*/
        #header{
            height: 24px;
            background-color: #232228;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            -webkit-app-region: drag;
            z-index: 1000;
        }
        #header-left{
            display: flex;
            height: 100%;
            align-items: center;
            -webkit-app-region: no-drag;
        }
        #title{
            font-size: 12px;
            color: #788;
        }
        #window-controls{
            display: flex;
            height: 100%;
            -webkit-app-region: no-drag;
        }
        .control-button{
            justify-content:center;
            align-items:center;
            background: transparent;
            border: none;
            color: #aaa;
            width: 40px;
            height: 100%;
            display: flex;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
        }
        .control-button{
            font-size: 12px;
        }
        .control-button-large{
            font-size: 16px;
        }
        .control-button.active{
            background-color: #333;
            color:#fff;
        }
        .control-button:hover{
            background-color: #333;
            color: #fff;
        }
        #close-button:hover{
            background-color: #e81123;
            color: #fff;

        }
    </style>
</head>

<body>
    <div id="header">
        <div id="header-left">
            <button class="control-button" id="pin-button">[Pin]</button>       
            <button class="control-button" id="dev-button">[Dev]</button>                 
        </div>
        <span id="title"></span>
        <div id="window-controls">

            <button class="control-button " id="min-button">&#8212;</button>
            <button class="control-button control-button-large" id="max-button">&#9634;</button>
            <button class="control-button" id="close-button">&#10005;</button>
        </div>
    </div>

    <div id="canvas">
    </div>
    <script src="index.js"></script>

</body>
</html>
