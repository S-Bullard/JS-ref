<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>JS PhotoReference</title>
    <style>
        * {box-sizing: border-box;} 
        body, html{
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #424150;
            color:aliceblue;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #canvas {
            width:100%;
            height:100%;
            position: relative;
            cursor:grab;
        }
        #canvas:active{
            cursor:grabbing;
        }
        /*additional styling for dropped images */
        /*images.js handles images on canvas*/  

        /*header styling*/
        #header{
            height: 24px;
            background-color: #232228;
            display: flex;
            justify-content: right;
            align-items: center;
            user-select: none;
            -webkit-app-region: drag;
            z-index: 1000;
        }
        #title{
            font-size: 12px;
            color: #788;
        }
        #window-controls{
            display: flex;
            height: 100%;
            -webkit-app-region: no-drag;
        }
        .control-button{
            justify-content:center;
            align-items:center;
            background: transparent;
            border: none;
            color: #aaa;
            width: 40px;
            height: 100%;
            display: flex;
            font-size: 12px;
            cursor: pointer;
        }
        .control-button:hover{
            background-color: #333;
            color: #fff;
        }
        #close-button:hover{
            background-color: #e81123;
            color: #fff;

        }
    </style>
</head>

<body>
    <div id="header">
        <span id="title"></span>
        <div id="window-controls">
            <button class="control-button" id="close-button">&#10005</button>
        </div>
    </div>


    <div id="canvas">
    </div>
    <script src="index.js"></script>
</body>
</html>
